    async function pobierzKonfiguracje() {
        try {
            const docSnap = await getDoc(doc(db, "ustawienia", "konfiguracja"));
            if (docSnap.exists()) {
                globalConfig = { ...globalConfig, ...docSnap.data() };
                return globalConfig;
            }
        } catch (e) {
            console.error("Błąd konfiguracji: ", e);
        }
        return globalConfig;
    }

    async function odswiezCacheNauczycieli() {
        try {
            const querySnapshot = await getDocs(collection(db, "nauczyciele"));
            cacheNauczycieli = {};
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                cacheNauczycieli[docSnap.id] = { id: docSnap.id, ...data };
                if (data.nazwa) cacheNauczycieli[data.nazwa] = { id: docSnap.id, ...data };
                if (data.imie && data.nazwisko) {
                    cacheNauczycieli[`${data.imie} ${data.nazwisko}`] = { id: docSnap.id, ...data };
                    cacheNauczycieli[`${data.nazwisko} ${data.imie}`] = { id: docSnap.id, ...data };
                }
            });
        } catch(e) {
            console.error("Błąd ładowania cache nauczycieli:", e);
        }
    }

    function formatNauczyciel(nazwa, kontekst = 'plan') {
        if (!nazwa) return '';
        const t = cacheNauczycieli[nazwa] || cacheNauczycieli[nazwa.trim()];
        
        let fmt = globalConfig.formatNauczyciela || 'pelny';
        if (kontekst === 'spis') {
            fmt = globalConfig.formatNauczycielaSpis || globalConfig.formatNauczyciela || 'pelny';
        } else if (kontekst === 'naglowek') {
            if (t && t.formatNaglowek && t.formatNaglowek !== 'globalny' && t.formatNaglowek !== '') {
                fmt = t.formatNaglowek;
            } else {
                fmt = globalConfig.formatNauczyciela || 'pelny';
            }
        } else if (kontekst === 'plan') {
            if (t && t.formatPlan && t.formatPlan !== 'globalny' && t.formatPlan !== '' && t.formatPlan !== 'pelny') {
                fmt = t.formatPlan;
            } else {
                fmt = globalConfig.formatNauczyciela || 'pelny';
            }
        }
        
        let imie = t ? t.imie : '';
        let nazwisko = t ? t.nazwisko : '';
        let inicjaly = t ? t.inicjaly : '';

        if (!imie || !nazwisko) {
            const parts = nazwa.trim().split(' ');
            if (parts.length >= 2) {
                imie = parts[0];
                nazwisko = parts.slice(1).join(' ');
            } else {
                nazwisko = nazwa;
            }
        }

        if (!inicjaly && imie && nazwisko) {
            inicjaly = imie.charAt(0).toUpperCase() + nazwisko.charAt(0).toUpperCase();
        }

        switch (fmt) {
            case 'imie_nazwisko_skrot':
                return imie && nazwisko ? `${imie.charAt(0)}. ${nazwisko} (${inicjaly})` : nazwa;
            case 'nazwisko_imie':
                return imie && nazwisko ? `${nazwisko} ${imie} (${inicjaly})` : nazwa;
            case 'inicjaly':
                return inicjaly || nazwa;
            case 'tylko_inicjaly':
                return imie && nazwisko ? `${imie.charAt(0)}. ${nazwisko}` : nazwa;
            case 'nazwisko':
                return nazwisko || nazwa;
            case 'pelny':
            default:
                return imie && nazwisko ? `${imie} ${nazwisko}` : nazwa;
        }
    }

    function formatSala(nazwa) {
        if (!nazwa) return '';
        const fmt = globalConfig.formatSali || 'pelny';
        if (fmt === 'skrot') {
            return nazwa.replace(/^sala\s+/i, '');
        }
        return nazwa;
    }

        document.documentElement.style.setProperty('--link-visited', m.visited);
        document.documentElement.style.setProperty('--link-hover', m.linkHover);

        if (pageTitleEl) pageTitleEl.innerText = naglowekText;

        const logoTd = document.getElementById('main-logo-td');

                <button onclick="zmienWidok('public')">Strona Główna</button>
                ${pokazPrzycisk ? `<button onclick="sprawdzLogowanieAdmina()">Panel Admina</button>` : ''}
            `;
        }

        if (config.theme) {
            const m = motywy[config.theme] || motywy.morski;
            document.documentElement.style.setProperty('--bg-header', m.header);
            document.documentElement.style.setProperty('--border-color', m.border);
            document.documentElement.style.setProperty('--bg-table', m.table);
            document.documentElement.style.setProperty('--bg-cell', m.cell || '#ffffff');
            document.documentElement.style.setProperty('--btn-hover', m.hover);
            document.documentElement.style.setProperty('--text-color', m.text);
            document.documentElement.style.setProperty('--link-color', m.link);
            document.documentElement.style.setProperty('--link-visited', m.visited);
            document.documentElement.style.setProperty('--link-hover', m.linkHover);
        }
        return config;
    }

    async function pobierzKolekcje(nazwa) {
        try {
            const querySnapshot = await getDocs(collection(db, nazwa));
            let lista = [];

            console.error(`Błąd pobierania ${nazwa}: `, e);

    function chunkArray(arr, size) {
        let results = [];
        for (let i = 0; i < arr.length; i += size) {
            results.push(arr.slice(i, i + size));
        }
        return results;
    }

    function renderujKomorkeLekcji(lekcjeLubLekcja, kontekst = 'oddzial', extraInfo = '') {
        if (!lekcjeLubLekcja) return "&nbsp;";
        const arr = Array.isArray(lekcjeLubLekcja) ? lekcjeLubLekcja : [lekcjeLubLekcja];
        if (arr.length === 0) return "&nbsp;";

        return arr.map(l => {
            if (!l || (!l.przedmiot && !l.nauczyciel && !l.sala)) return null;
            
            const przedmiotTxt = l.grupa ? `${l.przedmiot}-${l.grupa}` : (l.przedmiot || '');
            const nFmt = formatNauczyciel(l.nauczyciel, 'plan');
            const sFmt = formatSala(l.sala);

            const nauczycielLink = l.nauczyciel ? `<a class="n" onclick="pokazPlanNauczyciela('${l.nauczyciel}')">${nFmt}</a>` : '';
            const salaLink = l.sala ? `<a class="s" onclick="pokazPlanSal('${l.sala}')">${sFmt}</a>` : '';
            
            let opis = '';
            if (kontekst === 'oddzial') {
                opis = `<span class="op">${nauczycielLink} | ${salaLink}</span>`;
            } else if (kontekst === 'nauczyciel') {
                opis = `<span class="op">[${extraInfo}] s. ${salaLink}</span>`;
            } else if (kontekst === 'sala') {
                opis = `<span class="op">[${extraInfo}] ${nauczycielLink}</span>`;
            }

            return `<div style="${arr.length > 1 ? 'margin-bottom:2px;' : ''}"><span class="p">${przedmiotTxt}</span><br>${opis}</div>`;
        }).filter(Boolean).join('<div style="border-top: 1px dotted #999; margin: 2px 0;"></div>') || "&nbsp;";
    }

        const modalOverlay = document.createElement('div');

        modalOverlay.className = 'modal-overlay';
        modalOverlay.innerHTML = `

                    </tr>

                                <table border="1" cellpadding="2" cellspacing="0" style="width: 100%; border-collapse: collapse; background:#fff;">

        document.getElementById('modal-generuj-btn').onclick = async function() {
            const btn = this;
            const oddzialId = document.getElementById('gen-oddzial-id').value;
            const dataObowiazywania = document.getElementById('gen-data-obowiazywania').value.trim() || '10.09.2026r.';
            const now = new Date();
            const dataWygenerowania = `${now.getDate()}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`;
            const komunikat = document.getElementById('gen-komunikat');

            if (!oddzialId) {
                komunikat.className = "error";
                komunikat.innerText = "Wybierz oddział!";
                return;
            }

            let zapotrzebowanie = {};
            let preferowaneSale = {};
            let preferowanePozycje = {};
            const inputs = modalOverlay.querySelectorAll('input[type="number"]');
            let sumaGodzin = 0;
            inputs.forEach(inp => {
                const prj = inp.getAttribute('data-przedmiot');
                const godz = parseInt(inp.value) || 0;
                if (godz > 0) {
                    zapotrzebowanie[prj] = godz;
                    sumaGodzin += godz;
                    const salaVal = modalOverlay.querySelector(`select[data-przedmiot-sala="${prj}"]`).value;
                    if (salaVal) preferowaneSale[prj] = salaVal;
                    const pozVal = modalOverlay.querySelector(`select[data-przedmiot-pozycja="${prj}"]`).value;
                    if (pozVal) preferowanePozycje[prj] = pozVal;
                }
            });

            if (sumaGodzin === 0) {
                komunikat.className = "error";
                komunikat.innerText = "Wprowadź przynajmniej jedną godzinę przedmiotu!";
                return;
            }

            btn.disabled = true;
            komunikat.className = "";
            komunikat.innerText = "Generowanie planu...";

            const planyWszystkie = await pobierzKolekcje("plany_lekcji");
            let zajeciNauczyciele = {};
            let zajeteSale = {};

            planyWszystkie.forEach(p => {
                if (p.oddzialId === oddzialId) return;
                if (p.siatka) {
                    Object.keys(p.siatka).forEach(dzien => {
                        if (!zajeciNauczyciele[dzien]) zajeciNauczyciele[dzien] = {};
                        if (!zajeteSale[dzien]) zajeteSale[dzien] = {};
                        Object.keys(p.siatka[dzien]).forEach(nr => {
                            if (!zajeciNauczyciele[dzien][nr]) zajeciNauczyciele[dzien][nr] = new Set();
                            if (!zajeteSale[dzien][nr]) zajeteSale[dzien][nr] = new Set();

                            const lekcje = Array.isArray(p.siatka[dzien][nr]) ? p.siatka[dzien][nr] : [p.siatka[dzien][nr]];
                            lekcje.forEach(l => {
                                if (l.nauczyciel) zajeciNauczyciele[dzien][nr].add(l.nauczyciel);
                                if (l.sala) zajeteSale[dzien][nr].add(l.sala);
                            });
                        });
                    });
                }
            });

            const dni = ["Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek"];
            const godziny = await pobierzDzwonki();
            const numeryGodzin = Object.keys(godziny).sort((a,b) => Number(a)-Number(b));

            let siatka = {};
            dni.forEach(d => siatka[d] = {});

            let zadaniaPoczatkowe = [];
            let zadaniaKoncowe = [];
            let zadaniaDowolne = [];

            Object.keys(zapotrzebowanie).forEach(przedmiot => {
                const ile = zapotrzebowanie[przedmiot];
                const poz = preferowanePozycje[przedmiot] || 'dowolna';
                for (let i = 0; i < ile; i++) {
                    if (poz === 'poczatek') zadaniaPoczatkowe.push({ przedmiot });
                    else if (poz === 'koniec') zadaniaKoncowe.push({ przedmiot });
                    else zadaniaDowolne.push({ przedmiot });
                }
            });

            zadaniaDowolne.sort(() => Math.random() - 0.5);

            let sukces = true;
            let nieprzydzielone = [];

            async function umiescZadania(listaZadan, trybPozycji) {
                for (let zadanie of listaZadan) {
                    const przedmiot = zadanie.przedmiot;
                    const pasujacyNauczyciele = nauczyciele.filter(n => n.przedmioty && n.przedmioty.includes(przedmiot));
                    
                    let przydzielono = false;
                    let shuffledDni = [...dni].sort(() => Math.random() - 0.5);
                    
                    let godzinyKolejnosc = [...numeryGodzin];
                    if (trybPozycji === 'poczatek') {
                        godzinyKolejnosc.sort((a,b) => Number(a) - Number(b));
                    } else if (trybPozycji === 'koniec') {
                        godzinyKolejnosc.sort((a,b) => Number(b) - Number(a));
                    } else {
                        godzinyKolejnosc.sort(() => Math.random() - 0.5);
                    }

                    slotLoop:
                    for (let dzien of shuffledDni) {
                        for (let nr of godzinyKolejnosc) {
                            if (siatka[dzien][nr] && siatka[dzien][nr].length > 0) continue;

                            let tList = [...pasujacyNauczyciele].sort(() => Math.random() - 0.5);
                            let sList = [];
                            const prefSala = preferowaneSale[przedmiot];
                            if (prefSala) {
                                const foundSala = sale.find(s => s.nazwa === prefSala);
                                if (foundSala) sList.push(foundSala);
                            }
                            sale.forEach(s => {
                                if (!sList.includes(s)) sList.push(s);
                            });

                            for (let t of tList) {
                                const nName = t.nazwa;
                                if (zajeciNauczyciele[dzien]?.[nr]?.has(nName)) continue;

                                for (let s of sList) {
                                    const sName = s.nazwa;
                                    if (zajeteSale[dzien]?.[nr]?.has(sName)) continue;

                                    if (!siatka[dzien][nr]) siatka[dzien][nr] = [];
                                    siatka[dzien][nr].push({
                                        grupa: "",
                                        przedmiot: przedmiot,
                                        nauczyciel: nName,
                                        sala: sName
                                    });

                                    if (!zajeciNauczyciele[dzien]) zajeciNauczyciele[dzien] = {};
                                    if (!zajeciNauczyciele[dzien][nr]) zajeciNauczyciele[dzien][nr] = new Set();
                                    zajeciNauczyciele[dzien][nr].add(nName);

                                    if (!zajeteSale[dzien]) zajeteSale[dzien] = {};
                                    if (!zajeteSale[dzien][nr]) zajeteSale[dzien][nr] = new Set();
                                    zajeteSale[dzien][nr].add(sName);

                                    przydzielono = true;
                                    break slotLoop;
                                }
                            }
                        }
                    }

                    if (!przydzielono) {
                        sukces = false;
                        nieprzydzielone.push(przedmiot);
                    }
                }
            }

            await umiescZadania(zadaniaPoczatkowe, 'poczatek');
            await umiescZadania(zadaniaKoncowe, 'koniec');
            await umiescZadania(zadaniaDowolne, 'dowolna');

            try {
                const q = query(collection(db, "plany_lekcji"), where("oddzialId", "==", oddzialId));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const existingDocId = querySnapshot.docs[0].id;
                    await updateDoc(doc(db, "plany_lekcji", existingDocId), { oddzialId, godziny, siatka, dataObowiazywania, dataWygenerowania });
                } else {
                    await addDoc(collection(db, "plany_lekcji"), { oddzialId, godziny, siatka, dataObowiazywania, dataWygenerowania });
                }

                if (sukces) {
                    komunikat.className = "success";
                    komunikat.innerText = "Plan wygenerowany i zapisany pomyślnie!";
                } else {
                    komunikat.className = "error";
                    komunikat.innerText = `Plan zapisany z brakami. Nie udało się zmieścić przedmiotów: ${nieprzydzielone.join(', ')}.`;
                }
                setTimeout(() => {
                    document.getElementById('dynamic-modal').remove();
                    renderAdminPanel();
                }, 2500);
            } catch (error) {
                komunikat.className = "error";
                komunikat.innerText = "Błąd zapisu: " + error.message;
                btn.disabled = false;
            }
        };
    };

                        <td width="25%"><strong>Motyw graficzny:</strong></td>
                        <td>
                            <select id="admin-theme-select" style="width: 250px; display:inline-block; margin-right: 10px;">
                                ${motywyOpcje}
                            </select>
                            <button onclick="zapiszMotywAdmin()">Zmień motyw</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Nagłówek strony:</strong></td>
                        <td>
                            <input type="text" id="admin-naglowek-input" value="${config.naglowek || 'VULCAN OPTIVUM PLAN'}" style="width: 250px; display: inline-block; margin-right: 10px;">
                            <button onclick="zapiszNaglowekAdmin()">Zapisz nagłówek</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Tryb spisu (Wybierz plan do wyświetlenia):</strong></td>
                        <td>
                            <select id="admin-tryb-spisu-select" style="width: 250px; display:inline-block; margin-right: 10px;">
                                <option value="kafelkowy" ${config.trybWyswietlaniaSpisu === 'kafelkowy' ? 'selected' : ''}>Widok kafelkowy</option>
                                <option value="tabelka" ${config.trybWyswietlaniaSpisu === 'tabelka' ? 'selected' : ''}>Widok w tabeli</option>
                            </select>
                            <button onclick="zapiszOpcjeWyswietlania()">Zapisz tryb spisu</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Widoczność przycisku Panel Admina:</strong></td>
                        <td>
                            <input type="checkbox" id="admin-btn-visibility-toggle" ${config.pokazPrzyciskAdmina !== false ? 'checked' : ''} style="width:auto; margin-right: 10px;">
                            <button onclick="zapiszWidocznoscPrzyciskuAdmina()">Zapisz ustawienie</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Format nauczycieli w spisie:</strong></td>
                        <td>
                            <select id="admin-format-nauczyciela-spis" style="width: 320px; display:inline-block; margin-right: 10px;">
                                <option value="pelny" ${config.formatNauczycielaSpis === 'pelny' ? 'selected' : ''}>Jan Nowak</option>
                                <option value="imie_nazwisko_skrot" ${config.formatNauczycielaSpis === 'imie_nazwisko_skrot' ? 'selected' : ''}>J. Nowak (JN)</option>
                                <option value="nazwisko_imie" ${config.formatNauczycielaSpis === 'nazwisko_imie' ? 'selected' : ''}>Nowak Jan (JN)</option>
                                <option value="inicjaly" ${config.formatNauczycielaSpis === 'inicjaly' ? 'selected' : ''}>JN</option>
                                <option value="tylko_inicjaly" ${config.formatNauczycielaSpis === 'tylko_inicjaly' ? 'selected' : ''}>J. Nowak</option>
                                <option value="nazwisko" ${config.formatNauczycielaSpis === 'nazwisko' ? 'selected' : ''}>Nowak</option>
                            </select>
                            <button onclick="zapiszOpcjeWyswietlania()">Zapisz format</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Domyślny format nauczycieli na planie:</strong></td>
                        <td>
                            <select id="admin-format-nauczyciela" style="width: 320px; display:inline-block; margin-right: 10px;">
                                <option value="pelny" ${config.formatNauczyciela === 'pelny' ? 'selected' : ''}>Jan Nowak</option>
                                <option value="imie_nazwisko_skrot" ${config.formatNauczyciela === 'imie_nazwisko_skrot' ? 'selected' : ''}>J. Nowak (JN)</option>
                                <option value="nazwisko_imie" ${config.formatNauczyciela === 'nazwisko_imie' ? 'selected' : ''}>Nowak Jan (JN)</option>
                                <option value="inicjaly" ${config.formatNauczyciela === 'inicjaly' ? 'selected' : ''}>JN</option>
                                <option value="tylko_inicjaly" ${config.formatNauczyciela === 'tylko_inicjaly' ? 'selected' : ''}>J. Nowak</option>
                                <option value="nazwisko" ${config.formatNauczyciela === 'nazwisko' ? 'selected' : ''}>Nowak</option>
                            </select>
                            <button onclick="zapiszOpcjeWyswietlania()">Zapisz format</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Format sal na planie:</strong></td>
                        <td>
                            <select id="admin-format-sali" style="width: 320px; display:inline-block; margin-right: 10px;">
                                <option value="pelny" ${config.formatSali === 'pelny' ? 'selected' : ''}>Pełna nazwa</option>
                                <option value="skrot" ${config.formatSali === 'skrot' ? 'selected' : ''}>Bez słowa "Sala"</option>
                            </select>
                            <button onclick="zapiszOpcjeWyswietlania()">Zapisz format</button>
                        </td>
                    </tr>
                </table>

                <table class="tabela" border="0" cellpadding="4" cellspacing="0" style="width:100%; margin-bottom:15px;">
                    <tr><th colspan="4" style="background:${currentHeaderBg}; color:#fff; padding:6px;">Zarządzanie bazą zasobów</th></tr>
                    <tr>
                        <td width="25%" style="vertical-align:top;">
                            <strong>Oddziały (Klasy)</strong><br>
                            <button onclick="otworzModalDodawania('oddzialy', 'Dodaj oddział (klasę)', 'np. 5Tb')" style="margin-top:5px; width:100%;">+ Dodaj klasę</button>
                            <ul style="padding-left:15px; font-size:11px; margin-top:5px; line-height: 1.6;">${oddzialyList || 'Brak'}</ul>
                        </td>
                        <td width="25%" style="vertical-align:top;">
                            <strong>Nauczyciele</strong><br>
                            <button onclick="otworzModalNauczyciela()" style="margin-top:5px; width:100%;">+ Dodaj nauczyciela</button>
                            <ul style="padding-left:15px; font-size:11px; margin-top:5px; line-height: 1.6;">${nauczycieleList || 'Brak'}</ul>
                        </td>
                        <td width="25%" style="vertical-align:top;">
                            <strong>Sale</strong><br>
                            <button onclick="otworzModalDodawania('sale', 'Dodaj salę', 'np. Sala 120')" style="margin-top:5px; width:100%;">+ Dodaj salę</button>
                            <ul style="padding-left:15px; font-size:11px; margin-top:5px; line-height: 1.6;">${saleList || 'Brak'}</ul>
                        </td>
                        <td width="25%" style="vertical-align:top;">
                            <strong>Przedmioty</strong><br>
                            <button onclick="otworzModalDodawania('przedmioty', 'Dodaj przedmiot', 'np. Matematyka')" style="margin-top:5px; width:100%;">+ Dodaj przedmiot</button>
                            <ul style="padding-left:15px; font-size:11px; margin-top:5px; line-height: 1.6;">${przedmiotyList || 'Brak'}</ul>
                        </td>
                    </tr>
                </table>

                <table class="tabela" border="0" cellpadding="4" cellspacing="0" style="width:100%; margin-bottom:15px;">
                    <tr><th colspan="2" style="background:${currentHeaderBg}; color:#fff; padding:6px;">${edytowanyPlanId ? 'Edycja Planu Lekcji (Manualna)' : 'Tworzenie Nowego Planu Lekcji (Manualne)'}</th></tr>
                    <tr>
                        <td width="20%"><strong>Wybierz Oddział:</strong></td>
                        <td><select id="admin-oddzial-id" style="width:300px;">${oddzialyOptions}</select></td>
                    </tr>
                    <tr>
                        <td><strong>Data obowiązywania od:</strong></td>
                        <td><input type="text" id="admin-data-obowiazywania" value="${domyslnaDataObowiazywania}" style="width: 300px;"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="background:var(--bg-table); padding:6px;">
                            <strong>Dodatkowa godzina lekcyjna:</strong> 
                            Nr: <input type="text" id="input-new-nr" placeholder="1" style="width:40px; display:inline-block;"> 
                            Od: <input type="text" id="input-new-od" placeholder="8:00" style="width:70px; display:inline-block;"> 
                            Do: <input type="text" id="input-new-do" placeholder="8:45" style="width:70px; display:inline-block;">
                            <button onclick="dodajWierszGodziny()" style="margin-left:5px;">+ Dodaj godzinę</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="padding:0;">
                            <table class="tabela editor-table" border="0" cellpadding="4" cellspacing="0" style="width:100%; border:none; margin-bottom:0;">
                                <thead>
                                    <tr style="background:${currentHeaderBg}; color:#fff;"><th>Nr</th><th>Godzina</th>${dni.map(d => `<th>${d}</th>`).join('')}<th>Akcja</th></tr>
                                </thead>
                                <tbody id="edytor-tbody"></tbody>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align:center; padding: 10px;">
                            <button id="zapisz-plan-btn" style="width:250px;">${edytowanyPlanId ? 'Zapisz zmiany w planie' : 'Utwórz nowy plan'}</button>
                            ${edytowanyPlanId ? '<button onclick="anulujEdycje()" style="margin-left:10px;">Anuluj edycję</button>' : ''}
                            <div id="admin-komunikat"></div>
                            <div id="konflikty-komunikat" style="color: #b00000; font-weight: bold; margin-top: 5px; background: #ffe6e6; padding: 5px; border: 1px solid #ff9999;"></div>
                        </td>
                    </tr>
                </table>

                <table class="tabela" border="0" cellpadding="4" cellspacing="0" style="width:100%;">
                    <tr><th colspan="2" style="background:${currentHeaderBg}; color:#fff; padding:6px;">Istniejące plany w bazie</th></tr>
                    ${planyZarzadzanie || '<tr><td colspan="2" style="text-align:center;">Brak wpisów</td></tr>'}
                </table>
            </div>
        `;

        // Inicjalizacja wierszy edytora planu
        const tbody = document.getElementById('edytor-tbody');
        let godzinyDoEdycji = dzwonkiAktualne;
        let siatkaEdycji = {};

        if (edytowanyPlanId) {
            const planDoEdycji = plany.find(p => p.id === edytowanyPlanId);
            if (planDoEdycji) {
                if (planDoEdycji.godziny) godzinyDoEdycji = planDoEdycji.godziny;
                if (planDoEdycji.siatka) siatkaEdycji = planDoEdycji.siatka;
            }
        }

        const numeryWierszy = Object.keys(godzinyDoEdycji).sort((a,b) => Number(a)-Number(b));
        numeryWierszy.forEach(nr => {
            const h = godzinyDoEdycji[nr] || { od: "8:00", do: "8:45" };
            const tr = document.createElement('tr');
            tr.setAttribute('data-nr', nr);
            tr.setAttribute('data-od', h.od);
            tr.setAttribute('data-do', h.do);

            let rowHTML = `
                <td class="nr" style="text-align:center;">${nr}</td>
                <td class="g" style="text-align:center; white-space:nowrap;">${h.od} - ${h.do} <button onclick="edytujGodzineWiersza(this, '${nr}')" style="font-size:9px; padding:1px 3px; margin-left:5px;">Edytuj</button></td>
            `;

            dni.forEach(dzien => {
                let lekcjeDnia = siatkaEdycji[dzien]?.[nr] || [];
                if (!Array.isArray(lekcjeDnia)) lekcjeDnia = [lekcjeDnia];
                if (lekcjeDnia.length === 0) lekcjeDnia = [{ grupa: "", przedmiot: "", nauczyciel: "", sala: "" }];

                let grupyHTML = lekcjeDnia.map((l, lIdx) => `
                    <div class="grupa-item" style="margin-bottom:4px; ${lIdx > 0 ? 'border-top:1px solid #ccc; padding-top:4px;' : ''}">
                        Gr: <input type="text" data-pole="grupa" value="${l.grupa || ''}" style="width:35px; display:inline-block;" placeholder="np. 1"><br>
                        Przedmiot: <select data-pole="przedmiot" style="width:110px; display:inline-block;">
                            <option value="">-- wybierz --</option>
                            ${przedmioty.map(pr => `<option value="${pr.nazwa}" ${l.przedmiot === pr.nazwa ? 'selected' : ''}>${pr.nazwa}</option>`).join('')}
                        </select><br>
                        Nauczyciel: <select data-pole="nauczyciel" style="width:110px; display:inline-block;">
                            <option value="">-- wybierz --</option>
                            ${nauczyciele.map(n => `<option value="${n.nazwa}" ${l.nauczyciel === n.nazwa ? 'selected' : ''}>${formatNauczyciel(n.nazwa, 'pelny')}</option>`).join('')}
                        </select><br>
                        Sala: <select data-pole="sala" style="width:110px; display:inline-block;">
                            <option value="">-- wybierz --</option>
                            ${sale.map(s => `<option value="${s.nazwa}" ${l.sala === s.nazwa ? 'selected' : ''}>${formatSala(s.nazwa)}</option>`).join('')}
                        </select>
                        ${lIdx > 0 ? '<button onclick="this.closest(\'.grupa-item\').remove()" style="color:red; font-size:9px; padding:1px 3px; margin-top:2px;">Usuń grupę</button>' : ''}
                    </div>
                `).join('');

                rowHTML += `<td class="l" style="vertical-align:top;">
                    <div class="grupy-kontener">${grupyHTML}</div>
                    <button onclick="dodajGrupeDoKomorki(this)" style="font-size:9px; padding:2px 4px; margin-top:4px;">+ Grupa</button>
                </td>`;
            });

            rowHTML += `<td style="text-align:center;"><button onclick="usunWierszGodziny(this)" style="color:red; padding:2px 5px;">Usuń</button></td>`;
            tr.innerHTML = rowHTML;
            tbody.appendChild(tr);
        });

        // Obsługa zapisu planu manualnego
        document.getElementById('zapisz-plan-btn').onclick = async function() {
            const btn = this;
            const oddzialId = document.getElementById('admin-oddzial-id').value;
            const dataObowiazywania = document.getElementById('admin-data-obowiazywania').value.trim() || '10.09.2026r.';
            const now = new Date();
            const dataWygenerowania = `${now.getDate()}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`;
            const komunikat = document.getElementById('admin-komunikat');
            const konfliktyEl = document.getElementById('konflikty-komunikat');
            konfliktyEl.innerText = "";

            if (!oddzialId) {
                komunikat.className = "error";
                komunikat.innerText = "Wybierz oddział (klasę) dla planu!";
                return;
            }

            let godziny = {};
            let siatka = {};
            dni.forEach(d => siatka[d] = {});

            const wierszeTabeli = tbody.querySelectorAll('tr');
            wierszeTabeli.forEach(tr => {
                const nr = tr.getAttribute('data-nr');
                const od = tr.getAttribute('data-od');
                const doH = tr.getAttribute('data-do');
                godziny[nr] = { od, do: doH };

                dni.forEach((dzien, dIdx) => {
                    const td = tr.querySelectorAll('td.l')[dIdx];
                    if (!td) return;
                    const grupaItems = td.querySelectorAll('.grupa-item');
                    let lekcjeWKomorce = [];

                    grupaItems.forEach(gItem => {
                        const grupa = gItem.querySelector('input[data-pole="grupa"]').value.trim();
                        const przedmiot = gItem.querySelector('select[data-pole="przedmiot"]').value;
                        const nauczyciel = gItem.querySelector('select[data-pole="nauczyciel"]').value;
                        const sala = gItem.querySelector('select[data-pole="sala"]').value;

                        if (przedmiot || nauczyciel || sala) {
                            lekcjeWKomorce.push({ grupa, przedmiot, nauczyciel, sala });
                        }
                    });

                    if (lekcjeWKomorce.length > 0) {
                        if (!siatka[dzien]) siatka[dzien] = {};
                        siatka[dzien][nr] = lekcjeWKomorce.length === 1 ? lekcjeWKomorce[0] : lekcjeWKomorce;
                    }
                });
            });

            btn.disabled = true;
            komunikat.className = "";
            komunikat.innerText = "Zapisywanie planu...";

            try {
                const planyWszystkie = await pobierzKolekcje("plany_lekcji");
                let konflikty = [];

                planyWszystkie.forEach(p => {
                    if (edytowanyPlanId && p.id === edytowanyPlanId) return;
                    if (p.oddzialId === oddzialId) return;
                    const inneOddz = oddzialy.find(o => o.id === p.oddzialId);
                    const nazwaInnejKlasy = inneOddz ? inneOddz.nazwa : "Inna klasa";

                    dni.forEach(dzien => {
                        if (p.siatka && p.siatka[dzien] && siatka[dzien]) {
                            Object.keys(siatka[dzien]).forEach(nr => {
                                if (p.siatka[dzien][nr]) {
                                    const mojeLekcje = Array.isArray(siatka[dzien][nr]) ? siatka[dzien][nr] : [siatka[dzien][nr]];
                                    const inneLekcje = Array.isArray(p.siatka[dzien][nr]) ? p.siatka[dzien][nr] : [p.siatka[dzien][nr]];

                                    mojeLekcje.forEach(ml => {
                                        inneLekcje.forEach(il => {
                                            if (ml.nauczyciel && ml.nauczyciel === il.nauczyciel) {
                                                konflikty.push(`Nauczyciel ${ml.nauczyciel} jest już zajęty w ${dzien} na godzinie ${nr} (${nazwaInnejKlasy}).`);
                                            }
                                            if (ml.sala && ml.sala === il.sala) {
                                                konflikty.push(`Sala ${ml.sala} jest już zajęta w ${dzien} na godzinie ${nr} (${nazwaInnejKlasy}).`);
                                            }
                                        });
                                    });
                                }
                            });
                        }
                    });
                });

                if (konflikty.length > 0) {
                    konfliktyEl.innerHTML = "Wykryto konflikty w planie:<br>" + konflikty.join("<br>");
                }

                if (edytowanyPlanId) {
                    await updateDoc(doc(db, "plany_lekcji", edytowanyPlanId), { oddzialId, godziny, siatka, dataObowiazywania, dataWygenerowania });
                } else {
                    const q = query(collection(db, "plany_lekcji"), where("oddzialId", "==", oddzialId));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        const existingDocId = querySnapshot.docs[0].id;
                        await updateDoc(doc(db, "plany_lekcji", existingDocId), { oddzialId, godziny, siatka, dataObowiazywania, dataWygenerowania });
                    } else {
                        await addDoc(collection(db, "plany_lekcji"), { oddzialId, godziny, siatka, dataObowiazywania, dataWygenerowania });
                    }
                }

                komunikat.className = "success";
                komunikat.innerText = "Plan zapisany pomyślnie!";
                setTimeout(() => {
                    renderAdminPanel();
                }, 1500);
            } catch(e) {
                komunikat.className = "error";
                komunikat.innerText = "Błąd zapisu: " + e.message;
                btn.disabled = false;
            }
        };

        tbody.addEventListener('change', async function(e) {
            if (e.target && e.target.getAttribute('data-pole') === 'przedmiot') {
                const wybranyPrzedmiot = e.target.value;
                const grupaItem = e.target.closest('.grupa-item');
                if (!grupaItem) return;
                const nauczycielSelect = grupaItem.querySelector('select[data-pole="nauczyciel"]');
                if (!nauczycielSelect) return;

                if (!wybranyPrzedmiot) return;
                const pasujacyNauczyciele = nauczyciele.filter(n => n.przedmioty && n.przedmioty.includes(wybranyPrzedmiot));
                if (pasujacyNauczyciele.length === 1) {
                    nauczycielSelect.value = pasujacyNauczyciele[0].nazwa;
                }
            }
        });
    };

    window.zmienWidok('public');
</script>

</body>
</html>
